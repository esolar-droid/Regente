<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Sistema para Regentes</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <img src="https://colmarista.com/wp-content/uploads/2026/10/logohorizontal.png" alt="Logo Colegio Marista" class="login-logo">
            <h2 class="login-title">SISTEMA PARA REGENTES</h2>
            
            <form class="login-form">
                <div class="field">
                    <div class="control">
                        <input class="input is-large" type="text" placeholder="Usuario" required>
                    </div>
                </div>
                
                <div class="field">
                    <div class="control">
                        <input class="input is-large" type="password" placeholder="Contraseña" required>
                    </div>
                </div>
                
                <div class="field">
                    <div class="control">
                        <button class="button is-large is-fullwidth login-button">
                            <span>INICIAR SESIÓN</span>
                        </button>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
